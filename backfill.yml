"""
Shared helper functions used by both the hourly feature pipeline
and the historical backfill script.
"""
import time
import logging
import requests
import pandas as pd
from datetime import datetime, timezone

import config

logging.basicConfig(level=logging.INFO, format="%(asctime)s | %(levelname)s | %(message)s")
log = logging.getLogger(__name__)


def _get_with_retry(url, params, retries=3, backoff=2):
    last_err = None
    for attempt in range(retries):
        try:
            r = requests.get(url, params=params, timeout=15)
            r.raise_for_status()
            return r.json()
        except Exception as e:  # noqa: BLE001
            last_err = e
            log.warning(f"GET {url} failed (attempt {attempt+1}/{retries}): {e}")
            time.sleep(backoff * (attempt + 1))
    raise RuntimeError(f"Failed to fetch {url}: {last_err}")


def fetch_aqicn_current():
    """Fetch current AQI + pollutant breakdown from AQICN for Hyderabad, Sindh."""
    if not config.AQICN_TOKEN:
        raise EnvironmentError("AQICN_TOKEN is not set")
    data = _get_with_retry(config.AQICN_GEO_URL, {"token": config.AQICN_TOKEN})
    if data.get("status") != "ok":
        raise RuntimeError(f"AQICN error: {data}")
    d = data["data"]
    iaqi = d.get("iaqi", {})

    def g(key):
        return iaqi.get(key, {}).get("v")

    return {
        "timestamp": pd.to_datetime(d["time"]["iso"]).tz_convert("UTC"),
        "aqi": d.get("aqi"),
        "pm25": g("pm25"),
        "pm10": g("pm10"),
        "o3": g("o3"),
        "no2": g("no2"),
        "so2": g("so2"),
        "co": g("co"),
        "station": d.get("city", {}).get("name"),
    }


def fetch_openweather_pollution():
    """Fetch current pollutant concentrations + OWM's own AQI index (1-5 scale)."""
    if not config.OWM_API_KEY:
        raise EnvironmentError("OWM_API_KEY is not set")
    params = {"lat": config.LATITUDE, "lon": config.LONGITUDE, "appid": config.OWM_API_KEY}
    data = _get_with_retry(config.OWM_AIR_POLLUTION_URL, params)
    item = data["list"][0]
    comp = item["components"]
    return {
        "timestamp": pd.to_datetime(item["dt"], unit="s", utc=True),
        "owm_aqi_index": item["main"]["aqi"],
        "pm2_5": comp.get("pm2_5"),
        "pm10": comp.get("pm10"),
        "o3": comp.get("o3"),
        "no2": comp.get("no2"),
        "so2": comp.get("so2"),
        "co": comp.get("co"),
        "nh3": comp.get("nh3"),
    }


def fetch_openweather_weather():
    """Fetch current weather (needed as exogenous features for the model)."""
    if not config.OWM_API_KEY:
        raise EnvironmentError("OWM_API_KEY is not set")
    params = {
        "lat": config.LATITUDE,
        "lon": config.LONGITUDE,
        "appid": config.OWM_API_KEY,
        "units": "metric",
    }
    data = _get_with_retry(config.OWM_WEATHER_URL, params)
    return {
        "timestamp": pd.to_datetime(data["dt"], unit="s", utc=True),
        "temp": data["main"]["temp"],
        "humidity": data["main"]["humidity"],
        "pressure": data["main"]["pressure"],
        "wind_speed": data["wind"]["speed"],
        "wind_deg": data["wind"].get("deg"),
        "clouds": data["clouds"]["all"],
    }


def fetch_openweather_forecast():
    """5-day / 3-hour weather forecast — used as *future* exogenous features
    when generating the next-3-day AQI forecast at inference time."""
    if not config.OWM_API_KEY:
        raise EnvironmentError("OWM_API_KEY is not set")
    params = {
        "lat": config.LATITUDE,
        "lon": config.LONGITUDE,
        "appid": config.OWM_API_KEY,
        "units": "metric",
    }
    data = _get_with_retry(config.OWM_FORECAST_URL, params)
    rows = []
    for item in data["list"]:
        rows.append({
            "timestamp": pd.to_datetime(item["dt"], unit="s", utc=True),
            "temp": item["main"]["temp"],
            "humidity": item["main"]["humidity"],
            "pressure": item["main"]["pressure"],
            "wind_speed": item["wind"]["speed"],
            "wind_deg": item["wind"].get("deg"),
            "clouds": item["clouds"]["all"],
        })
    return pd.DataFrame(rows)


def aqi_category(aqi_value: float):
    for lo, hi, label, color in config.AQI_CATEGORIES:
        if lo <= aqi_value <= hi:
            return label, color
    return "Hazardous+", "maroon"


def utcnow():
    return datetime.now(timezone.utc)
